<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Meridian - Lunar Flight Simulator</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23cfd6e4'/%3E%3C/svg%3E" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        font: 14px/1.4 system-ui, 'Segoe UI', sans-serif;
        color: #d8dee9;
      }
      #viewport {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        outline: none;
      }
      #ui-root {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      /* First paint, before the program has loaded: the look of the loading screen (src/app/loading.ts), which
         replaces it as soon as it runs. Colours and type are those of src/core/ui/theme.ts. */
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(120% 90% at 50% 30%, #0c1522 0%, #070b12 55%, #04060a 100%);
        font-family: Bahnschrift, 'DIN Alternate', 'Segoe UI', system-ui, sans-serif;
        color: #eef4fb;
      }
      #boot-splash div div:first-child {
        font-size: calc(min(1vh, 0.5625vw) * 1.5);
        letter-spacing: 0.24em;
        color: #55d4ff;
      }
      #boot-splash div div:last-child {
        font-size: calc(min(1vh, 0.5625vw) * 3.3);
        font-weight: 600;
        margin-top: calc(min(1vh, 0.5625vw) * 0.9);
      }
      #boot-splash > div {
        width: calc(min(1vh, 0.5625vw) * 92);
        max-width: 92vw;
      }
      #fatal {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 10vh 10vw;
        background: #05070b;
        text-align: center;
      }
      #fatal.visible {
        display: flex;
      }
      #fatal div {
        max-width: 44rem;
      }
      #fatal h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 0.75rem;
      }
      #fatal p {
        margin: 0;
        color: #9aa5b8;
      }
    </style>
  </head>
  <body>
    <canvas id="viewport" tabindex="0"></canvas>
    <div id="ui-root"></div>
    <div id="boot-splash" role="status">
      <div>
        <div>MERIDIAN</div>
        <div>Loading the program</div>
      </div>
    </div>
    <div id="fatal" role="alert">
      <div>
        <h1>Cannot start the simulator</h1>
        <p id="fatal-message"></p>
      </div>
    </div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>

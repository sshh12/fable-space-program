# The high-fidelity form of the local stack (ARCHITECTURE 16.4): reached ONLY through the launcher,
#   STACK_NAME=fsp-<package> npm run stack -- --compose -- <suite>
# which holds the stack slot, refuses unless the WSL 2 VM is capped at 6 GB (%UserProfile%\.wslconfig),
# starts the Docker daemon if it is stopped and stops what it started. Project name fsp-<STACK_NAME>.
#
#   postgres  the Postgres 18 image Railway's template is built on, created with production's cluster
#             settings (POSTGRES_INITDB_ARGS) and production's ALTER SYSTEM values
#   minio     the S3 store for the dumps bucket and for the upload and presign scripts
#   game      the pinned role image, ROLES=game (the hello stand-in until wave 5)
#   shell     the pinned role image, ROLES=shell; the packs bucket is the host's stand-in over data/packs
#             (host.docker.internal:47201): tiles reach the containers over HTTP, never as the plain-file
#             tree through a bind mount
#   dump      the dump role of the same image, on demand: docker compose run --rm dump
name: fsp-local

x-image: &image
  build:
    context: ../..
    dockerfile: deploy/Dockerfile
  image: fsp-roles:local

x-packs: &packs
  PACKS_BUCKET: packs
  PACKS_ENDPOINT: http://host.docker.internal:47201
  PACKS_REGION: us-east-1
  PACKS_ACCESS_KEY_ID: stack-local
  PACKS_SECRET_ACCESS_KEY: stack-local-secret
  PACKS_PATH_STYLE: "1"

services:
  postgres:
    image: postgres:18-bookworm@sha256:f1ea2a1a4fb7b68d4836be1fdcb8a6466a89b072158bf9d97663600538c294c5
    environment:
      POSTGRES_PASSWORD: stack-local
      POSTGRES_DB: fsp
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8
    command: ["postgres", "-c", "shared_buffers=96MB", "-c", "max_wal_size=256MB", "-c", "min_wal_size=64MB", "-c", "max_connections=40"]
    ports: ["127.0.0.1:47220:5432"]
    volumes: ["pg:/var/lib/postgresql"]
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fsp"]
      interval: 1s
      timeout: 3s
      retries: 60

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: stack-local
      MINIO_ROOT_PASSWORD: stack-local-secret
    ports: ["127.0.0.1:47221:9000"]
    volumes: ["minio:/data"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30

  game:
    <<: *image
    environment:
      ROLES: game
      PORT: "8080"
      DATABASE_URL: postgres://postgres:stack-local@postgres:5432/fsp
      PACK_MIRROR_ORDER: bucket,mirror
      MIRROR_BASE: http://127.0.0.1:47202/p/
      MIRROR_MODE: slices
      RAILWAY_DEPLOYMENT_DRAINING_SECONDS: "45"
      <<: *packs
    ports: ["127.0.0.1:47203:8080"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30

  shell:
    <<: *image
    environment:
      ROLES: shell
      PORT: "8080"
      ENDPOINT_GATE: http://127.0.0.1:47203
      ENDPOINT_API: http://127.0.0.1:47203
      ENDPOINT_PUB: http://127.0.0.1:47203
      MIRROR_SLICE_BYTES: "2097152"
      <<: *packs
    ports: ["127.0.0.1:47202:8080"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 60

  dump:
    <<: *image
    profiles: ["jobs"]
    environment:
      ROLES: dump
      DATABASE_URL: postgres://postgres:stack-local@postgres:5432/fsp
      DUMPS_BUCKET: dumps
      DUMPS_ENDPOINT: http://minio:9000
      DUMPS_REGION: us-east-1
      DUMPS_ACCESS_KEY_ID: stack-local
      DUMPS_SECRET_ACCESS_KEY: stack-local-secret
      DUMPS_PATH_STYLE: "1"
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }

volumes:
  pg: {}
  minio: {}

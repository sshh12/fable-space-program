# CI (ARCHITECTURE 16.2, "Mechanics shared by the stages"): on pushes to main and pull requests into main (and
# by hand), within 8 minutes. Every action is pinned by commit SHA; the comment names the tag it was resolved from.
#   checks  the secrets check, the stub scan (TODO / FIXME / stub / placeholder), typecheck (browser and Node
#           configurations), the boundary rules, the unit suites on synthetic terrain (CI has no baked tiles
#           and no GPU: real-data tests skip themselves), and the production client build
#   image   the ONE image from deploy/Dockerfile, a smoke test of a role in it, and its buildId (the hash of the
#           Node image digest and the server bundle) recorded in the job summary and as an artefact; at
#           stage 0 Railway builds the same Dockerfile at the same commit, and the rollout compares the ids.
#           Equal buildIds prove the same Node base and server bundle only: the client build is compared by
#           its own id (clientBuild in /version.json), the pg_dump package by its pinned version
#   publish (written, used from stage 1 only: repository variable PUBLISH_IMAGE=true) pushes the image to
#           GHCR and records its digest; Railway's Hobby plan cannot pull a private registry image
# The repository is private, so Actions minutes are finite: path filters skip pushes that touch only
# documents, and every job has a hard time budget.
name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'out/**'
      - '.claude/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'out/**'
      - '.claude/**'
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24.16.0

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund --ignore-scripts && npm rebuild esbuild
      # check-secrets compares with this machine's .env, which CI never has; the pattern scan finds the shape
      # of a credential (known key formats, high-entropy values under secret-like names) without it.
      - name: Secrets check
        run: node tools/dev/check-secrets.mjs && node deploy/ci/secret-patterns.mjs
      - name: Stub scan
        run: node tools/dev/check-stubs.mjs
      - name: Typecheck (browser and Node configurations)
        run: npm run typecheck
      - name: Boundaries
        run: npx vitest run tools/dev/boundaries.test.ts
      # CI has no baked data (data/tiles, data/sky are not in the repository). These files read it without
      # skipping when it is absent (run 43194854038: "baked tiles are missing", ENOENT data/sky): request
      # docs/requests/platform-delivery-1.md asks their owners to skip without the data, as
      # tests/unit/terrain-core/realData.test.ts does; each entry goes when its file does.
      - name: Unit suites (synthetic terrain)
        run: >-
          npx vitest run
          --exclude tests/unit/site-bake/pads.test.ts
          --exclude tests/unit/sim-world/commands.test.ts
          --exclude tests/unit/sim-world/protocol.test.ts
          --exclude tests/unit/sim-world/surface.test.ts
          --exclude tests/unit/sim-world/milestones.test.ts
          --exclude tests/unit/sim-world/browserLoop.test.ts
          --exclude tests/unit/sim-world/scenario.test.ts
          --exclude tests/unit/sim-vessel/trajectory-fixtures/trajectory-fixtures.test.ts
          --exclude tests/unit/terrain-render/selection.test.ts
          --exclude tests/unit/sky/skyData.test.ts
      - name: Production client build
        run: node tools/dev/build-client.mjs --target=ci

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build the image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          build-args: COMMIT=${{ github.sha }}
          tags: fsp:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (a role in the pinned image) and buildId
        run: |
          set -euo pipefail
          docker run --rm fsp:ci node --version
          docker run --rm fsp:ci /usr/lib/postgresql/18/bin/pg_dump --version
          info=$(docker run --rm fsp:ci cat /app/server/build-info.json)
          echo "$info" | tee build-info.json
          id=$(echo "$info" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).buildId))")
          cid=$(docker run -d -e ROLES=game -e PORT=8080 -p 8080:8080 fsp:ci)
          for i in $(seq 1 30); do curl -sf localhost:8080/healthz > health.json && break; sleep 1; done
          cat health.json
          docker logs "$cid" | tee role.log
          docker rm -f "$cid"
          grep -q "\"buildId\":\"$id\"" health.json
          grep -q "\"buildId\":\"$id\"" role.log
          echo "buildId \`$id\` (commit ${{ github.sha }})" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-info
          path: build-info.json

  publish:
    if: vars.PUBLISH_IMAGE == 'true' && github.ref_type == 'tag'
    needs: [checks, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          build-args: COMMIT=${{ github.sha }}
          tags: ghcr.io/${{ github.repository }}/roles:${{ github.ref_name }}
          push: true
          cache-from: type=gha
      - run: echo "image digest ${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

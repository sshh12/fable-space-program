<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark" />
    <title>Map view lab</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        font: 12px/1.4 Consolas, 'Cascadia Mono', ui-monospace, monospace;
        color: #cfd6e4;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        outline: none;
      }
      #info {
        position: fixed;
        left: 12px;
        bottom: 10px;
        white-space: pre;
        pointer-events: none;
        color: #8b97a9;
      }
      #toggles {
        position: fixed;
        right: 12px;
        bottom: 10px;
        color: #aab6c8;
        user-select: none;
      }
      #toggles label {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <canvas id="viewport" tabindex="0"></canvas>
    <div id="info"></div>
    <div id="toggles"><label><input type="checkbox" id="intercept" /> encounters at intercept</label></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
